<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bloom Fisching</title>
<style>
  :root {
    --sky-top: #ffb3c7; --sky-bot: #ffe3b0;
    --water-top: #3aa6c9; --water-bot: #0b3a5c;
    --ui-bg: rgba(14, 24, 40, 0.82); --ui-fg: #f4f7fb; --accent: #ff7aa8; --good: #6be38a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b1a2a; color: var(--ui-fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden;
    -webkit-user-select: none; user-select: none; touch-action: none; }
  #game { display: block; width: 100vw; height: 100vh; }
  .hud { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; gap: 8px;
    justify-content: space-between; pointer-events: none; }
  .pill { background: var(--ui-bg); padding: 8px 12px; border-radius: 999px; font-weight: 600;
    font-size: 14px; pointer-events: auto; }
  .btns { display: flex; gap: 8px; }
  button { font: inherit; color: var(--ui-fg); background: var(--ui-bg); border: 1px solid rgba(255,255,255,.15);
    border-radius: 999px; padding: 8px 12px; cursor: pointer; font-weight: 600; font-size: 14px; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #msg { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ui-bg);
    padding: 10px 16px; border-radius: 12px; text-align: center; max-width: calc(100vw - 32px);
    font-size: 15px; pointer-events: none; }
  .panel { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.5); padding: 16px; }
  .panel.open { display: flex; }
  .card { background: #13233a; border-radius: 16px; padding: 18px; width: min(440px, 100%);
    max-height: 80vh; overflow-y: auto; }
  .card h2 { margin: 0 0 12px; font-size: 20px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.08); font-size: 14px; }
  .row small { opacity: .7; display: block; }
  .close { margin-top: 12px; width: 100%; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud">
  <div class="pill" id="coins">🪙 0</div>
  <div class="btns">
    <button id="shopBtn">Shop</button>
    <button id="bookBtn">Journal</button>
  </div>
</div>
<div id="msg">Hold to charge your cast, release to throw.</div>

<div class="panel" id="shop"><div class="card">
  <h2>Shop</h2><div id="shopList"></div>
  <button class="close" data-close="shop">Close</button>
</div></div>
<div class="panel" id="book"><div class="card">
  <h2>Fish Journal</h2><div id="bookList"></div>
  <button class="close" data-close="book">Close</button>
</div></div>

<script>
(() => {
  // ---------- Data ----------
  const RARITIES = {
    Common:    { color: '#cfd8e3', weight: 60 },
    Uncommon:  { color: '#6be38a', weight: 25 },
    Rare:      { color: '#5aa9ff', weight: 10 },
    Epic:      { color: '#c07bff', weight: 4 },
    Legendary: { color: '#ffcc4d', weight: 1 },
  };
  // difficulty: how jumpy the fish is in the reel minigame (0..1)
  const FISH = [
    { name: 'Bloom Minnow',   rarity: 'Common',    price: 5,   diff: 0.15 },
    { name: 'Petal Perch',    rarity: 'Common',    price: 8,   diff: 0.2 },
    { name: 'Mud Carp',       rarity: 'Common',    price: 10,  diff: 0.25 },
    { name: 'Rosefin Trout',  rarity: 'Uncommon',  price: 22,  diff: 0.35 },
    { name: 'Lily Pike',      rarity: 'Uncommon',  price: 28,  diff: 0.4 },
    { name: 'Moonscale Bass', rarity: 'Rare',      price: 60,  diff: 0.55 },
    { name: 'Coral Snapper',  rarity: 'Rare',      price: 75,  diff: 0.6 },
    { name: 'Aurora Eel',     rarity: 'Epic',      price: 180, diff: 0.75 },
    { name: 'Sakura Koi',     rarity: 'Epic',      price: 220, diff: 0.8 },
    { name: 'Roslit Leviathan', rarity: 'Legendary', price: 750, diff: 0.95 },
  ];
  const RODS = [
    { name: 'Twig Rod',    cost: 0,    bar: 0.22, luck: 1.0, speed: 1.0 },
    { name: 'Bamboo Rod',  cost: 150,  bar: 0.27, luck: 1.3, speed: 1.15 },
    { name: 'Petal Rod',   cost: 600,  bar: 0.32, luck: 1.8, speed: 1.3 },
    { name: 'Aurora Rod',  cost: 2000, bar: 0.38, luck: 2.6, speed: 1.5 },
  ];

  // ---------- Save ----------
  const SAVE_KEY = 'bloomfisching-save-v1';
  let save = { coins: 0, rod: 0, owned: [0], caught: {} };
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s) save = { ...save, ...s }; } catch {}
  const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch {} };

  // ---------- Canvas ----------
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize); resize();

  const $ = id => document.getElementById(id);
  const msg = t => { $('msg').innerHTML = t; };
  const updateCoins = () => { $('coins').textContent = '🪙 ' + save.coins; };
  updateCoins();

  // ---------- State machine ----------
  // idle -> charging -> flying -> waiting -> bite -> reeling -> result -> idle
  let state = 'idle';
  let charge = 0, chargeDir = 1;
  let bobber = { x: 0, y: 0, tx: 0, ty: 0, t: 0 };
  let waitTimer = 0, biteTimer = 0;
  let hooked = null;
  let reel = null;
  let resultTimer = 0;
  let pressing = false;
  let t = 0;

  const waterY = () => H * 0.52;
  const rodTip = () => ({ x: W * 0.18, y: waterY() - 120 });
  const rod = () => RODS[save.rod];

  function pickFish() {
    const luck = rod().luck;
    // luck boosts rarer tiers
    const tiers = Object.entries(RARITIES).map(([k, v], i) => [k, v.weight * Math.pow(luck, i)]);
    let total = tiers.reduce((a, [, w]) => a + w, 0), r = Math.random() * total;
    let rarity = tiers[0][0];
    for (const [k, w] of tiers) { if ((r -= w) <= 0) { rarity = k; break; } }
    const pool = FISH.filter(f => f.rarity === rarity);
    return pool[Math.floor(Math.random() * pool.length)];
  }

  // ---------- Input ----------
  const anyPanelOpen = () => document.querySelector('.panel.open');
  function down(e) {
    if (anyPanelOpen() || e.target.closest('button')) return;
    pressing = true;
    if (state === 'idle') { state = 'charging'; charge = 0; chargeDir = 1; msg('Release to cast!'); }
    else if (state === 'bite') startReel();
    else if (state === 'waiting') { msg('Too early! The fish got spooked.'); reset(1.2); }
  }
  function up() {
    pressing = false;
    if (state === 'charging') cast();
  }
  cv.addEventListener('pointerdown', down);
  window.addEventListener('pointerup', up);
  window.addEventListener('keydown', e => { if (e.code === 'Space' && !e.repeat) { e.preventDefault(); down({ target: cv }); } });
  window.addEventListener('keyup', e => { if (e.code === 'Space') up(); });

  function cast() {
    const tip = rodTip();
    const dist = 0.25 + charge * 0.7;
    bobber = { x: tip.x, y: tip.y, sx: tip.x, sy: tip.y,
      tx: tip.x + (W - tip.x - 30) * dist, ty: waterY() + 10 + charge * 30, t: 0 };
    state = 'flying';
    msg('...');
  }

  function startWait() {
    state = 'waiting';
    // farther casts bite a bit faster
    waitTimer = (2 + Math.random() * 4) / rod().speed;
    msg('Waiting for a bite... (don\'t tap yet)');
  }

  function startBite() {
    state = 'bite'; biteTimer = 1.1;
    hooked = pickFish();
    msg('<b style="color:var(--accent)">! BITE ! Tap now!</b>');
  }

  function startReel() {
    state = 'reeling';
    reel = { fish: 0.5, fishV: 0, fishTarget: 0.5, zone: 0.5, zoneV: 0,
             size: rod().bar, progress: 0.3, retarget: 0 };
    msg('Hold to lift the bar, keep the fish inside it!');
  }

  function finishReel(success) {
    if (success) {
      const f = hooked;
      save.coins += f.price;
      save.caught[f.name] = (save.caught[f.name] || 0) + 1;
      persist(); updateCoins();
      msg(`Caught a <b style="color:${RARITIES[f.rarity].color}">${f.rarity} ${f.name}</b>! +${f.price} 🪙`);
    } else {
      msg('The fish escaped...');
    }
    reset(2.2);
  }

  function reset(delay) { state = 'result'; resultTimer = delay; reel = null; }

  // ---------- Update ----------
  function update(dt) {
    t += dt;
    if (state === 'charging') {
      charge += chargeDir * dt * 1.2;
      if (charge >= 1) { charge = 1; chargeDir = -1; }
      if (charge <= 0) { charge = 0; chargeDir = 1; }
    } else if (state === 'flying') {
      bobber.t = Math.min(1, bobber.t + dt * 1.6);
      const k = bobber.t;
      bobber.x = bobber.sx + (bobber.tx - bobber.sx) * k;
      bobber.y = bobber.sy + (bobber.ty - bobber.sy) * k - Math.sin(k * Math.PI) * 140;
      if (k >= 1) startWait();
    } else if (state === 'waiting') {
      waitTimer -= dt; if (waitTimer <= 0) startBite();
    } else if (state === 'bite') {
      biteTimer -= dt;
      if (biteTimer <= 0) { msg('Too slow! It got away.'); reset(1.5); }
    } else if (state === 'reeling') {
      const r = reel, d = hooked.diff;
      // fish darts around; harder fish move more often and further
      r.retarget -= dt;
      if (r.retarget <= 0) {
        r.retarget = 0.35 + Math.random() * (1.4 - d);
        const jump = (Math.random() - 0.5) * (0.4 + d);
        r.fishTarget = Math.max(0.03, Math.min(0.97, r.fish + jump));
      }
      r.fishV += (r.fishTarget - r.fish) * (6 + d * 10) * dt;
      r.fishV *= Math.pow(0.02, dt);
      r.fish = Math.max(0, Math.min(1, r.fish + r.fishV * dt * 4));
      // player bar: gravity vs lift
      r.zoneV += (pressing ? 2.6 : -2.2) * dt;
      r.zoneV *= Math.pow(0.3, dt);
      r.zone += r.zoneV * dt;
      const half = r.size / 2;
      if (r.zone < half) { r.zone = half; r.zoneV = Math.max(0, r.zoneV) * -0.3; }
      if (r.zone > 1 - half) { r.zone = 1 - half; r.zoneV = Math.min(0, r.zoneV) * -0.3; }
      const inside = Math.abs(r.fish - r.zone) < half;
      r.inside = inside;
      r.progress += (inside ? 0.28 * rod().speed : -0.2 - d * 0.1) * dt;
      if (r.progress >= 1) finishReel(true);
      else if (r.progress <= 0) finishReel(false);
    } else if (state === 'result') {
      resultTimer -= dt;
      if (resultTimer <= 0) { state = 'idle'; msg('Hold to charge your cast, release to throw.'); }
    }
  }

  // ---------- Draw ----------
  function draw() {
    const wy = waterY();
    // sky
    let g = ctx.createLinearGradient(0, 0, 0, wy);
    g.addColorStop(0, '#ffb3c7'); g.addColorStop(1, '#ffe3b0');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, wy);
    // sun
    ctx.fillStyle = 'rgba(255,240,200,.9)';
    ctx.beginPath(); ctx.arc(W * 0.78, wy * 0.45, Math.min(W, H) * 0.08, 0, Math.PI * 2); ctx.fill();
    // floating petals
    for (let i = 0; i < 14; i++) {
      const px = (i * 137 + t * 20 * (1 + i % 3)) % (W + 40) - 20;
      const py = (i * 53 % wy) + Math.sin(t + i) * 10;
      ctx.fillStyle = 'rgba(255,140,180,.7)';
      ctx.beginPath(); ctx.ellipse(px, py, 5, 3, t + i, 0, Math.PI * 2); ctx.fill();
    }
    // water
    g = ctx.createLinearGradient(0, wy, 0, H);
    g.addColorStop(0, '#3aa6c9'); g.addColorStop(1, '#0b3a5c');
    ctx.fillStyle = g; ctx.fillRect(0, wy, W, H - wy);
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 2;
    for (let row = 0; row < 4; row++) {
      ctx.beginPath();
      for (let x = 0; x <= W; x += 12) {
        const y = wy + 8 + row * 26 + Math.sin(x * 0.03 + t * 2 + row) * 3;
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    // dock
    ctx.fillStyle = '#7a4a2b';
    ctx.fillRect(0, wy - 20, W * 0.22, 20);
    for (let i = 0; i < 3; i++) ctx.fillRect(W * 0.04 + i * W * 0.07, wy - 4, 8, 60);
    // fisher
    const fx = W * 0.1, fy = wy - 20;
    ctx.fillStyle = '#2b3550';
    ctx.fillRect(fx - 10, fy - 50, 20, 50);
    ctx.fillStyle = '#ffd9b3';
    ctx.beginPath(); ctx.arc(fx, fy - 62, 12, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff7aa8'; ctx.fillRect(fx - 16, fy - 74, 32, 6); ctx.fillRect(fx - 9, fy - 86, 18, 12);
    // rod
    const tip = rodTip();
    ctx.strokeStyle = '#5a3a20'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(fx + 8, fy - 35); ctx.lineTo(tip.x, tip.y); ctx.stroke();
    // line + bobber
    if (['flying', 'waiting', 'bite', 'reeling'].includes(state)) {
      let bx = bobber.x, by = bobber.y;
      if (state === 'waiting') by += Math.sin(t * 3) * 2;
      if (state === 'bite') by += 6 + Math.sin(t * 30) * 4;
      if (state === 'reeling') { bx += Math.sin(t * 20) * 3; by += 8; }
      ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(tip.x, tip.y);
      ctx.quadraticCurveTo((tip.x + bx) / 2, Math.max(tip.y, by) + 30, bx, by); ctx.stroke();
      ctx.fillStyle = '#ff4d6d'; ctx.beginPath(); ctx.arc(bx, by, 7, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(bx, by, 7, 0, Math.PI); ctx.fill();
      if (state === 'bite') {
        ctx.fillStyle = '#fff'; ctx.font = 'bold 34px system-ui'; ctx.textAlign = 'center';
        ctx.fillText('!', bx, by - 20);
      }
    }
    // charge meter
    if (state === 'charging') {
      const mw = 160, mx = fx - 20, my = fy - 120;
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(mx, my, mw, 14);
      ctx.fillStyle = `hsl(${120 * charge}, 80%, 55%)`; ctx.fillRect(mx, my, mw * charge, 14);
      ctx.strokeStyle = '#fff'; ctx.strokeRect(mx, my, mw, 14);
    }
    if (state === 'reeling') drawReel();
  }

  function drawReel() {
    const r = reel;
    const bw = 44, bh = Math.min(H * 0.55, 360);
    const bx = W - bw - 40, by = (H - bh) / 2;
    // track
    ctx.fillStyle = 'rgba(10,20,35,.85)';
    roundRect(bx - 8, by - 8, bw + 16 + 22, bh + 16, 12); ctx.fill();
    ctx.fillStyle = '#1d3554'; ctx.fillRect(bx, by, bw, bh);
    // player zone (0 = bottom, 1 = top)
    const zh = r.size * bh, zy = by + bh - r.zone * bh - zh / 2;
    ctx.fillStyle = r.inside ? 'rgba(107,227,138,.6)' : 'rgba(255,255,255,.35)';
    ctx.fillRect(bx, zy, bw, zh);
    // fish
    const fy = by + bh - r.fish * bh;
    ctx.fillStyle = RARITIES[hooked.rarity].color;
    ctx.beginPath(); ctx.ellipse(bx + bw / 2, fy, 14, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(bx + bw / 2 + 12, fy); ctx.lineTo(bx + bw / 2 + 20, fy - 7);
    ctx.lineTo(bx + bw / 2 + 20, fy + 7); ctx.fill();
    // progress
    const px = bx + bw + 6;
    ctx.fillStyle = '#0b1a2a'; ctx.fillRect(px, by, 10, bh);
    ctx.fillStyle = r.progress > 0.66 ? '#6be38a' : r.progress > 0.33 ? '#ffcc4d' : '#ff6b6b';
    ctx.fillRect(px, by + bh * (1 - r.progress), 10, bh * r.progress);
  }

  function roundRect(x, y, w, h, rad) {
    ctx.beginPath();
    ctx.moveTo(x + rad, y); ctx.arcTo(x + w, y, x + w, y + h, rad); ctx.arcTo(x + w, y + h, x, y + h, rad);
    ctx.arcTo(x, y + h, x, y, rad); ctx.arcTo(x, y, x + w, y, rad); ctx.closePath();
  }

  // ---------- Panels ----------
  function renderShop() {
    $('shopList').innerHTML = RODS.map((r, i) => {
      const owned = save.owned.includes(i), equipped = save.rod === i;
      const label = equipped ? 'Equipped' : owned ? 'Equip' : `Buy ${r.cost} 🪙`;
      const dis = equipped || (!owned && save.coins < r.cost);
      return `<div class="row"><div><b>${r.name}</b>
        <small>Bar ${Math.round(r.bar * 100)}% · Luck x${r.luck} · Speed x${r.speed}</small></div>
        <button data-rod="${i}" ${dis ? 'disabled' : ''}>${label}</button></div>`;
    }).join('');
  }
  function renderBook() {
    $('bookList').innerHTML = FISH.map(f => {
      const n = save.caught[f.name] || 0, c = RARITIES[f.rarity].color;
      return `<div class="row"><div><b style="color:${n ? c : '#667'}">${n ? f.name : '???'}</b>
        <small>${f.rarity} · ${f.price} 🪙</small></div><div>x${n}</div></div>`;
    }).join('');
  }
  $('shopList').addEventListener('click', e => {
    const b = e.target.closest('button[data-rod]'); if (!b) return;
    const i = +b.dataset.rod;
    if (!save.owned.includes(i)) {
      if (save.coins < RODS[i].cost) return;
      save.coins -= RODS[i].cost; save.owned.push(i);
    }
    save.rod = i; persist(); updateCoins(); renderShop();
  });
  $('shopBtn').onclick = () => { renderShop(); $('shop').classList.add('open'); };
  $('bookBtn').onclick = () => { renderBook(); $('book').classList.add('open'); };
  document.querySelectorAll('[data-close]').forEach(b =>
    b.onclick = () => $(b.dataset.close).classList.remove('open'));

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt); draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
