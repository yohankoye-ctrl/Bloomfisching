<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bloom Fisching</title>
<style>
  :root {
    --sky-top: #ffb3c7; --sky-bot: #ffe3b0;
    --water-top: #3aa6c9; --water-bot: #0b3a5c;
    --ui-bg: rgba(14, 24, 40, 0.82); --ui-fg: #f4f7fb; --accent: #ff7aa8; --good: #6be38a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b1a2a; color: var(--ui-fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden;
    -webkit-user-select: none; user-select: none; touch-action: none; }
  #game { display: block; width: 100vw; height: 100vh; }
  .hud { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; gap: 8px;
    justify-content: space-between; pointer-events: none; }
  .pill { background: var(--ui-bg); padding: 8px 12px; border-radius: 999px; font-weight: 600;
    font-size: 14px; pointer-events: auto; }
  .btns { display: flex; gap: 8px; pointer-events: auto; }
  button { font: inherit; color: var(--ui-fg); background: var(--ui-bg); border: 1px solid rgba(255,255,255,.15);
    border-radius: 999px; padding: 8px 12px; cursor: pointer; font-weight: 600; font-size: 14px;
    white-space: nowrap; flex-shrink: 0; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #msg { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ui-bg);
    padding: 10px 16px; border-radius: 12px; text-align: center; max-width: calc(100vw - 32px);
    font-size: 15px; pointer-events: none; }
  .panel { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.5); padding: 16px; }
  .panel.open { display: flex; }
  .card { background: #13233a; border-radius: 16px; padding: 18px; width: min(440px, 100%);
    max-height: 80vh; overflow-y: auto; }
  .card h2 { margin: 0 0 12px; font-size: 20px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.08); font-size: 14px; }
  .row small { opacity: .7; display: block; }
  .close { margin-top: 12px; width: 100%; }
  #powerBtn { position: fixed; right: max(16px, env(safe-area-inset-right, 0px));
    bottom: calc(84px + env(safe-area-inset-bottom, 0px)); padding: 14px 20px; font-size: 16px;
    border: 2px solid #fff; }
  #powerBtn.freeze { background: linear-gradient(#bfefff, #4fb3e8); color: #062a44; border-color: #e8fbff;
    box-shadow: 0 0 16px rgba(120, 220, 255, .7); }
  #powerBtn.lightning { background: linear-gradient(#fff27a, #f5a700); color: #3a2400; border-color: #fff9c4;
    box-shadow: 0 0 18px rgba(255, 220, 60, .8); }
  #powerBtn.whirlpool { background: linear-gradient(#8ff5e6, #168a9c); color: #032c33; border-color: #d4fffa;
    box-shadow: 0 0 18px rgba(80, 230, 210, .7); }
  #powerBtn:disabled { box-shadow: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud">
  <div class="pill" id="coins">🪙 0</div>
  <div class="btns">
    <button id="shopBtn">Shop</button>
    <button id="bookBtn">Journal</button>
  </div>
</div>
<button id="powerBtn" hidden></button>
<div id="msg">Hold to charge your cast, release to throw.</div>

<div class="panel" id="shop"><div class="card">
  <h2>Shop</h2><div id="shopList"></div>
  <button class="close" data-close="shop">Close</button>
</div></div>
<div class="panel" id="book"><div class="card">
  <h2>Fish Journal</h2><div id="bookList"></div>
  <button class="close" data-close="book">Close</button>
</div></div>

<script>
(() => {
  // ---------- Data ----------
  const RARITIES = {
    // tier: how much rod luck boosts this rarity (higher = boosted more)
    Common:    { color: '#cfd8e3', weight: 60, tier: 0 },
    Uncommon:  { color: '#6be38a', weight: 25, tier: 1 },
    Rare:      { color: '#5aa9ff', weight: 10, tier: 2 },
    Epic:      { color: '#c07bff', weight: 4,  tier: 3 },
    Unique:    { color: '#ff9f1c', weight: 2,  tier: 3.5 },
    Legendary: { color: '#ffcc4d', weight: 1,  tier: 4 },
  };
  // difficulty: how jumpy the fish is in the reel minigame (0..1)
  const FISH = [
    { name: 'Bloom Minnow',   rarity: 'Common',    price: 5,   diff: 0.15 },
    { name: 'Petal Perch',    rarity: 'Common',    price: 8,   diff: 0.2 },
    { name: 'Mud Carp',       rarity: 'Common',    price: 10,  diff: 0.25 },
    { name: 'Rosefin Trout',  rarity: 'Uncommon',  price: 22,  diff: 0.35 },
    { name: 'Lily Pike',      rarity: 'Uncommon',  price: 28,  diff: 0.4 },
    { name: 'Moonscale Bass', rarity: 'Rare',      price: 60,  diff: 0.55 },
    { name: 'Coral Snapper',  rarity: 'Rare',      price: 75,  diff: 0.6 },
    { name: 'Aurora Eel',     rarity: 'Epic',      price: 180, diff: 0.75 },
    { name: 'Sakura Koi',     rarity: 'Epic',      price: 220, diff: 0.8 },
    { name: 'Amber Dragon',   rarity: 'Unique',    price: 200, diff: 0.14 },
    { name: 'Roslit Leviathan', rarity: 'Legendary', price: 750, diff: 0.95 },
  ];
  const RODS = [
    { name: 'Twig Rod',    cost: 0,    bar: 0.22, luck: 1.0, speed: 1.0 },
    { name: 'Bamboo Rod',  cost: 150,  bar: 0.27, luck: 1.3, speed: 1.15 },
    { name: 'Petal Rod',   cost: 600,  bar: 0.32, luck: 1.8, speed: 1.3 },
    { name: 'Aurora Rod',  cost: 2000, bar: 0.38, luck: 2.6, speed: 1.5 },
    // Special rod: big rare-fish luck plus the Freeze power while reeling
    { name: 'Frostbloom Rod', cost: 0, bar: 0.36, luck: 4, speed: 1.4, power: 'freeze' },
    { name: 'Thunder Rod',    cost: 1500, bar: 0.32, luck: 3, speed: 1.5, power: 'lightning' },
    { name: 'Maelstrom Rod',  cost: 2500, bar: 0.34, luck: 3.2, speed: 1.4, power: 'whirlpool' },
  ];

  // ---------- Save ----------
  const SAVE_KEY = 'bloomfisching-save-v1';
  let save = { coins: 0, rod: 0, owned: [0], caught: {} };
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s) save = { ...save, ...s }; } catch {}
  // Frostbloom Rod is a gift: owned by everyone, and equipped once the first time
  if (!save.owned.includes(4)) save.owned.push(4);
  if (!save.frostGift) { save.frostGift = true; save.rod = 4; }
  const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch {} };

  // ---------- Canvas ----------
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize); resize();

  const $ = id => document.getElementById(id);
  const msg = t => { $('msg').innerHTML = t; };
  const updateCoins = () => { $('coins').textContent = '🪙 ' + save.coins; };
  updateCoins();

  // ---------- State machine ----------
  // idle -> charging -> flying -> waiting -> bite -> reeling -> result -> idle
  let state = 'idle';
  let charge = 0, chargeDir = 1;
  let bobber = { x: 0, y: 0, tx: 0, ty: 0, t: 0 };
  let waitTimer = 0, biteTimer = 0;
  let hooked = null;
  let reel = null;
  let resultTimer = 0;
  let pressing = false;
  let t = 0;
  let celebrate = null; // Legendary / Unique catch animation
  let particles = [];
  let ability = null;     // active rod power animation { kind, t, dur }
  let fxParticles = [];   // sparks, droplets, etc. from rod powers
  let shake = { t: 0, dur: 1, mag: 0 };
  const shakeScreen = (dur, mag) => { if (mag >= shake.mag * shake.t / shake.dur) shake = { t: dur, dur, mag }; };

  const waterY = () => H * 0.52;
  const rodTip = () => ({ x: W * 0.18, y: waterY() - 120 });
  const rod = () => RODS[save.rod];

  function pickFish() {
    const luck = rod().luck;
    // luck boosts rarer tiers
    const tiers = Object.entries(RARITIES).map(([k, v]) => [k, v.weight * Math.pow(luck, v.tier)]);
    let total = tiers.reduce((a, [, w]) => a + w, 0), r = Math.random() * total;
    let rarity = tiers[0][0];
    for (const [k, w] of tiers) { if ((r -= w) <= 0) { rarity = k; break; } }
    const pool = FISH.filter(f => f.rarity === rarity);
    return pool[Math.floor(Math.random() * pool.length)];
  }

  // ---------- Input ----------
  const anyPanelOpen = () => document.querySelector('.panel.open');
  function down(e) {
    if (anyPanelOpen() || e.target.closest('button')) return;
    pressing = true;
    if (state === 'idle') { state = 'charging'; charge = 0; chargeDir = 1; msg('Release to cast!'); }
    else if (state === 'bite') startReel();
    else if (state === 'waiting') { msg('Too early! The fish got spooked.'); reset(1.2); }
  }
  function up() {
    pressing = false;
    if (state === 'charging') cast();
  }
  cv.addEventListener('pointerdown', down);
  window.addEventListener('pointerup', up);
  window.addEventListener('keydown', e => { if (e.code === 'Space' && !e.repeat) { e.preventDefault(); down({ target: cv }); } });
  window.addEventListener('keyup', e => { if (e.code === 'Space') up(); });

  function cast() {
    const tip = rodTip();
    const dist = 0.25 + charge * 0.7;
    bobber = { x: tip.x, y: tip.y, sx: tip.x, sy: tip.y,
      tx: tip.x + (W - tip.x - 30) * dist, ty: waterY() + 10 + charge * 30, t: 0 };
    state = 'flying';
    msg('...');
  }

  function startWait() {
    state = 'waiting';
    // farther casts bite a bit faster
    waitTimer = (2 + Math.random() * 4) / rod().speed;
    msg('Waiting for a bite... (don\'t tap yet)');
  }

  function startBite() {
    state = 'bite'; biteTimer = 1.1;
    hooked = pickFish();
    msg('<b style="color:var(--accent)">! BITE ! Tap now!</b>');
  }

  function startReel() {
    state = 'reeling';
    reel = { fish: 0.5, fishV: 0, fishTarget: 0.5, zone: 0.5, zoneV: 0,
             size: rod().bar, progress: 0.3, retarget: 0, frozen: 0, stun: 0, pull: 0, powerUsed: false };
    msg('Hold to lift the bar, keep the fish inside it!');
    const pw = POWERS[rod().power];
    if (pw) {
      const b = $('powerBtn');
      b.className = rod().power; b.textContent = pw.label; b.hidden = false; b.disabled = false;
    }
  }

  function finishReel(success) {
    if (success) {
      const f = hooked;
      save.coins += f.price;
      save.caught[f.name] = (save.caught[f.name] || 0) + 1;
      persist(); updateCoins();
      msg(`Caught a <b style="color:${RARITIES[f.rarity].color}">${f.rarity} ${f.name}</b>! +${f.price} 🪙`);
      if (f.rarity === 'Legendary' || f.rarity === 'Unique') { startCelebration(f); return; }
    } else {
      msg('The fish escaped...');
    }
    reset(2.2);
  }

  // ---------- Legendary celebration ----------
  const CELEBRATE_TIME = 4.2;
  const UNIQUE_TIME = 4.4;
  function startCelebration(f) {
    const dragon = f.rarity === 'Unique';
    celebrate = { t: 0, fish: f, sx: bobber.x, sy: waterY() + 8, kind: f.rarity,
                  dur: dragon ? UNIQUE_TIME : CELEBRATE_TIME };
    particles = [];
    // big splash where the fish breaks the surface (fiery for the dragon)
    for (let i = 0; i < (dragon ? 60 : 40); i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.6, sp = 150 + Math.random() * 350;
      particles.push({ x: celebrate.sx, y: celebrate.sy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 1 + Math.random() * 0.6, max: 1.6, size: 2 + Math.random() * 4, g: 700,
        color: dragon ? (i % 2 ? 'rgba(255,170,60,' : 'rgba(255,90,30,') : 'rgba(200,240,255,', add: dragon });
    }
    shakeScreen(dragon ? 1.0 : 0.8, dragon ? 14 : 10);
    reset(celebrate.dur);
  }

  function updateCelebration(dt) {
    if (!celebrate) return;
    celebrate.t += dt;
    const c = celebrate;
    if (c.kind === 'Unique') updateDragon(c, dt);
    // golden sparkles around the fish once it is in the air
    else if (c.t > 0.5 && c.t < CELEBRATE_TIME - 0.6) {
      const p = fishPos();
      for (let i = 0; i < 3; i++) {
        const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 160;
        particles.push({ x: p.x, y: p.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30,
          life: 0.8 + Math.random() * 0.7, max: 1.5, size: 1.5 + Math.random() * 3, color: 'rgba(255,215,90,', g: 60, star: true });
      }
    }
    for (const p of particles) {
      p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      if (p.drag) { p.vx *= Math.pow(p.drag, dt); p.vy *= Math.pow(p.drag, dt); }
    }
    particles = particles.filter(p => p.life > 0);
    if (c.t >= c.dur) { celebrate = null; particles = []; }
  }

  // fish leaps from the bobber to the middle of the sky, then hovers
  function fishPos() {
    const c = celebrate, cx = W / 2, cy = H * 0.34;
    const k = Math.min(1, c.t / 1.3), e = 1 - Math.pow(1 - k, 3);
    const x = c.sx + (cx - c.sx) * e;
    const y = c.sy + (cy - c.sy) * e - Math.sin(k * Math.PI) * H * 0.15;
    return { x, y: y + (k >= 1 ? Math.sin((c.t - 1.3) * 3) * 8 : 0), k };
  }

  function drawStar(x, y, r) {
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const rr = i % 2 ? r * 0.35 : r, a = i * Math.PI / 4;
      ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath(); ctx.fill();
  }

  function drawBigFish(x, y, scale, rot) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(scale, scale);
    const g = ctx.createLinearGradient(0, -30, 0, 30);
    g.addColorStop(0, '#fff3b0'); g.addColorStop(0.5, '#ffcc4d'); g.addColorStop(1, '#c98a12');
    ctx.fillStyle = g; ctx.strokeStyle = '#7a4e00'; ctx.lineWidth = 2;
    // tail
    ctx.beginPath(); ctx.moveTo(-50, 0); ctx.lineTo(-85, -30); ctx.quadraticCurveTo(-72, 0, -85, 30); ctx.closePath();
    ctx.fill(); ctx.stroke();
    // dorsal fin
    ctx.beginPath(); ctx.moveTo(-20, -24); ctx.quadraticCurveTo(0, -55, 25, -24); ctx.closePath(); ctx.fill(); ctx.stroke();
    // body
    ctx.beginPath(); ctx.ellipse(0, 0, 60, 30, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    // scales shimmer
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1.5;
    for (let i = -2; i <= 1; i++) { ctx.beginPath(); ctx.arc(i * 16, 0, 12, -1, 1); ctx.stroke(); }
    // eye
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(38, -8, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(40, -8, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // ---------- Unique (Amber Dragon) celebration ----------
  // A serpent dragon bursts out of the water, circles the sky breathing fire.
  function dragonPos(T) {
    const c = celebrate, cx = W / 2, cy = H * 0.33, R = Math.min(W, H) * 0.3;
    if (T < 1) {
      const k = Math.max(0, T), e = 1 - Math.pow(1 - k, 2);
      return { x: c.sx + (cx + R - c.sx) * e, y: c.sy + (cy - c.sy) * e - Math.sin(k * Math.PI) * H * 0.12 };
    }
    const a = (T - 1) * 2.4;
    return { x: cx + Math.cos(a) * R, y: cy + Math.sin(a) * R * 0.55 };
  }
  const DRAGON_SEGS = 30, SEG_GAP = 0.035;

  function updateDragon(c, dt) {
    const end = c.dur - 0.7;
    // fire breath from the head
    if (c.t > 1.3 && c.t < end) {
      const h = dragonPos(c.t), b = dragonPos(c.t - 0.02);
      const ang = Math.atan2(h.y - b.y, h.x - b.x);
      for (let i = 0; i < 3; i++) {
        const a = ang + (Math.random() - 0.5) * 0.5, sp = 220 + Math.random() * 200;
        particles.push({ x: h.x, y: h.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: -60, drag: 0.15,
          life: 0.5 + Math.random() * 0.3, max: 0.8, size: 4 + Math.random() * 4, grow: 3, add: true,
          color: ['rgba(255,200,80,', 'rgba(255,120,20,', 'rgba(230,50,10,'][i % 3] });
      }
    }
    // embers drifting up from the water
    if (c.t < end) for (let i = 0; i < 2; i++) {
      particles.push({ x: Math.random() * W, y: waterY() + Math.random() * 40, vx: (Math.random() - 0.5) * 30,
        vy: -60 - Math.random() * 80, g: 0, life: 1.5 + Math.random(), max: 2.5, size: 1.5 + Math.random() * 2,
        color: 'rgba(255,170,60,', add: true });
    }
  }

  function drawDragon(T) {
    const size = Math.min(W, H) / 400;
    const pts = [];
    for (let i = 0; i <= DRAGON_SEGS; i++) {
      const ti = T - i * SEG_GAP;
      if (ti < 0) break;
      pts.push(dragonPos(ti));
    }
    if (pts.length < 2) return;
    const width = i => size * (16 * (1 - i / (DRAGON_SEGS + 6)) + 3);
    // body from tail to head
    for (let i = pts.length - 1; i >= 1; i--) {
      const p = pts[i], q = pts[i - 1];
      const w = width(i);
      ctx.fillStyle = i % 2 ? '#e8590c' : '#f76707';
      ctx.beginPath(); ctx.arc(p.x, p.y, w, 0, Math.PI * 2); ctx.fill();
      // belly highlight
      ctx.fillStyle = 'rgba(255,220,140,.55)';
      ctx.beginPath(); ctx.arc(p.x, p.y + w * 0.3, w * 0.5, 0, Math.PI * 2); ctx.fill();
      // back spikes
      if (i % 3 === 0) {
        const ang = Math.atan2(q.y - p.y, q.x - p.x), nx = Math.cos(ang - Math.PI / 2), ny = Math.sin(ang - Math.PI / 2);
        ctx.fillStyle = '#7c2d12';
        ctx.beginPath();
        ctx.moveTo(p.x + nx * w * 0.6 - Math.cos(ang) * w * 0.5, p.y + ny * w * 0.6 - Math.sin(ang) * w * 0.5);
        ctx.lineTo(p.x + nx * w * 1.7, p.y + ny * w * 1.7);
        ctx.lineTo(p.x + nx * w * 0.6 + Math.cos(ang) * w * 0.5, p.y + ny * w * 0.6 + Math.sin(ang) * w * 0.5);
        ctx.fill();
      }
      // wings near the front, flapping
      if (i === 6) {
        const ang = Math.atan2(q.y - p.y, q.x - p.x), flap = Math.sin(T * 10) * 0.6;
        for (const side of [-1, 1]) {
          const a = ang + side * (Math.PI / 2 + flap * side);
          ctx.fillStyle = 'rgba(255,140,40,.85)'; ctx.strokeStyle = '#7c2d12'; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(p.x, p.y);
          ctx.quadraticCurveTo(p.x + Math.cos(a) * 40 * size - Math.cos(ang) * 30 * size,
            p.y + Math.sin(a) * 40 * size - Math.sin(ang) * 30 * size,
            p.x + Math.cos(a) * 55 * size, p.y + Math.sin(a) * 55 * size);
          ctx.lineTo(p.x - Math.cos(ang) * 22 * size, p.y - Math.sin(ang) * 22 * size);
          ctx.closePath(); ctx.fill(); ctx.stroke();
        }
      }
    }
    // head
    const h = pts[0], n = pts[1], ang = Math.atan2(h.y - n.y, h.x - n.x);
    ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(ang); ctx.scale(size, size);
    ctx.fillStyle = '#d9480f';
    ctx.beginPath(); ctx.ellipse(4, 0, 24, 15, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(22, 3, 14, 8, 0, 0, Math.PI * 2); ctx.fill(); // snout
    // horns
    ctx.strokeStyle = '#ffe8a3'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-6, -10); ctx.quadraticCurveTo(-20, -24, -32, -22); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-6, 10); ctx.quadraticCurveTo(-20, 24, -32, 22); ctx.stroke();
    // glowing eye
    ctx.fillStyle = '#fff3a0'; ctx.shadowColor = '#ffd43b'; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.ellipse(10, -6, 5, 3.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0; ctx.fillStyle = '#2b0a00';
    ctx.beginPath(); ctx.ellipse(11, -6, 1.5, 3, 0, 0, Math.PI * 2); ctx.fill();
    // whiskers
    ctx.strokeStyle = 'rgba(255,230,160,.8)'; ctx.lineWidth = 1.5;
    for (const sd of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(30, sd * 4);
      ctx.quadraticCurveTo(40, sd * (14 + Math.sin(T * 6) * 4), 30, sd * 26); ctx.stroke();
    }
    ctx.restore();
  }

  function drawUniqueCelebration() {
    const c = celebrate, T = c.t;
    const fade = Math.min(1, (c.dur - T) / 0.5);
    // warm dusk over the scene
    ctx.fillStyle = `rgba(45,12,0,${0.55 * Math.min(1, T / 0.4) * fade})`;
    ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.globalAlpha = fade;
    // amber glow ring in the sky the dragon circles
    const cx = W / 2, cy = H * 0.33, R = Math.min(W, H) * 0.3, ga = Math.min(1, Math.max(0, (T - 0.8) / 0.6));
    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 1.3);
    glow.addColorStop(0, `rgba(255,190,80,${0.55 * ga})`); glow.addColorStop(0.6, `rgba(255,120,30,${0.25 * ga})`);
    glow.addColorStop(1, 'rgba(255,90,0,0)');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(cx, cy, R * 1.3, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = `rgba(255,200,120,${0.35 * ga})`; ctx.lineWidth = 2; ctx.setLineDash([6, 10]);
    ctx.lineDashOffset = -T * 40;
    ctx.beginPath(); ctx.ellipse(cx, cy, R, R * 0.55, 0, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    // particles (fire, embers, splash) glow additively
    for (const q of particles) {
      const life = Math.max(0, q.life / q.max);
      ctx.globalCompositeOperation = q.add ? 'lighter' : 'source-over';
      // fire puffs are softer so overlapping flames stay orange instead of washing out white
      ctx.fillStyle = q.color + (life * fade * (q.grow ? 0.35 : 1)) + ')';
      const r = q.size * (1 + (q.grow || 0) * (1 - life));
      ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    drawDragon(T);
    // banner: wavy fire letters
    if (T > 1.2) {
      const b = Math.min(1, (T - 1.2) / 0.4);
      const fs = Math.min(W / 7, 70);
      ctx.save(); ctx.translate(W / 2, H * 0.68);
      ctx.scale(0.5 + 0.5 * b, 0.5 + 0.5 * b);
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.font = `900 ${fs}px system-ui, sans-serif`;
      const word = 'UNIQUE!', total = ctx.measureText(word).width;
      let x = -total / 2;
      for (let i = 0; i < word.length; i++) {
        const ch = word[i], w = ctx.measureText(ch).width, y = Math.sin(T * 6 + i * 0.8) * fs * 0.08;
        const tg = ctx.createLinearGradient(0, y - fs / 2, 0, y + fs / 2);
        tg.addColorStop(0, '#fff1c1'); tg.addColorStop(0.45, '#ff9f1c'); tg.addColorStop(1, '#c2410c');
        ctx.shadowColor = '#ff6a00'; ctx.shadowBlur = 18 + Math.sin(T * 20 + i) * 6;
        ctx.lineWidth = 6; ctx.strokeStyle = '#3b0d00'; ctx.strokeText(ch, x, y);
        ctx.fillStyle = tg; ctx.fillText(ch, x, y);
        x += w;
      }
      ctx.shadowBlur = 0; ctx.textAlign = 'center';
      ctx.font = `700 ${fs * 0.36}px system-ui, sans-serif`;
      ctx.lineWidth = 4; ctx.strokeText(c.fish.name, 0, fs * 0.8);
      ctx.fillStyle = '#ffe8c2'; ctx.fillText(c.fish.name, 0, fs * 0.8);
      ctx.restore();
    }
    ctx.restore();
    // orange burst at the moment of the catch
    if (T < 0.4) { ctx.fillStyle = `rgba(255,150,40,${0.8 * (1 - T / 0.4)})`; ctx.fillRect(0, 0, W, H); }
  }

  function drawCelebration() {
    if (celebrate.kind === 'Unique') return drawUniqueCelebration();
    const c = celebrate, T = c.t;
    const fade = Math.min(1, (CELEBRATE_TIME - T) / 0.5);
    // darken the scene
    ctx.fillStyle = `rgba(20,10,30,${0.45 * Math.min(1, T / 0.4) * fade})`;
    ctx.fillRect(0, 0, W, H);
    const p = fishPos();
    ctx.save(); ctx.globalAlpha = fade;
    // rotating golden rays behind the fish
    if (p.k > 0.6) {
      const ra = Math.min(1, (T - 0.8) / 0.5);
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(T * 0.6);
      const R = Math.max(W, H);
      for (let i = 0; i < 12; i++) {
        ctx.rotate(Math.PI / 6);
        ctx.fillStyle = `rgba(255,210,80,${0.18 * ra})`;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(R, -R * 0.12); ctx.lineTo(R, R * 0.12); ctx.closePath(); ctx.fill();
      }
      const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, 140);
      glow.addColorStop(0, `rgba(255,240,180,${0.8 * ra})`); glow.addColorStop(1, 'rgba(255,200,80,0)');
      ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(0, 0, 140, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    // particles
    for (const q of particles) {
      ctx.fillStyle = q.color + Math.max(0, q.life / q.max) + ')';
      if (q.star) drawStar(q.x, q.y, q.size * 1.6);
      else { ctx.beginPath(); ctx.arc(q.x, q.y, q.size, 0, Math.PI * 2); ctx.fill(); }
    }
    // the fish: grows and does a full flip during the leap
    const size = Math.min(W, H) / 320;
    const scale = (0.4 + 0.6 * p.k) * size * (1 + (p.k >= 1 ? Math.sin(T * 6) * 0.03 : 0));
    drawBigFish(p.x, p.y, scale, p.k < 1 ? p.k * Math.PI * 2 : Math.sin(T * 2) * 0.08);
    // banner
    if (T > 1.0) {
      const b = Math.min(1, (T - 1.0) / 0.35);
      const pop = b < 1 ? 0.3 + 0.7 * b + 0.25 * Math.sin(b * Math.PI) : 1 + Math.sin(T * 4) * 0.02;
      const fs = Math.min(W / 9, 64);
      ctx.save(); ctx.translate(W / 2, H * 0.62); ctx.scale(pop, pop);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `900 ${fs}px system-ui, sans-serif`;
      const tg = ctx.createLinearGradient(0, -fs / 2, 0, fs / 2);
      tg.addColorStop(0, '#fff6c2'); tg.addColorStop(0.5, '#ffcc4d'); tg.addColorStop(1, '#e08a00');
      ctx.lineWidth = 6; ctx.strokeStyle = '#4a2400'; ctx.strokeText('LEGENDARY!', 0, 0);
      ctx.fillStyle = tg; ctx.fillText('LEGENDARY!', 0, 0);
      ctx.font = `700 ${fs * 0.38}px system-ui, sans-serif`;
      ctx.lineWidth = 4; ctx.strokeText(c.fish.name, 0, fs * 0.75);
      ctx.fillStyle = '#fff'; ctx.fillText(c.fish.name, 0, fs * 0.75);
      ctx.restore();
    }
    ctx.restore();
    // white flash at the moment of the catch
    if (T < 0.35) { ctx.fillStyle = `rgba(255,255,255,${0.85 * (1 - T / 0.35)})`; ctx.fillRect(0, 0, W, H); }
  }

  // ---------- Rod powers ----------
  const FREEZE_TIME = 3, STUN_TIME = 1.2, PULL_TIME = 3.5, LIGHTNING_TIME = 1.3;
  const POWERS = {
    freeze: { label: '❄ Freeze', color: '#9fe6ff', desc: 'Freeze the fish for 3s', use() {
      reel.frozen = FREEZE_TIME; reel.fishV = 0;
      msg('<b style="color:#9fe6ff">❄ Fish frozen!</b> Get your bar on it!');
    } },
    lightning: { label: '⚡ Lightning', color: '#ffe066', desc: 'Strike the fish: +25% catch progress and stuns it', use() {
      reel.progress = Math.min(1, reel.progress + 0.25); reel.stun = STUN_TIME; reel.fishV = 0;
      ability = { kind: 'lightning', t: 0, dur: LIGHTNING_TIME, bolts: null, seed: 0 };
      shakeScreen(0.5, 12);
      const g = reelGeom(), fy = g.by + g.bh - reel.fish * g.bh;
      burst(bobber.x, bobber.y + 8, 30, ['rgba(255,245,160,', 'rgba(140,220,255,'], 420);
      burst(g.bx + g.bw / 2, fy, 24, ['rgba(255,245,160,', 'rgba(255,255,255,'], 300);
      msg('<b style="color:#ffe066">⚡ ZAP!</b> +25% and the fish is stunned!');
    } },
    whirlpool: { label: '🌀 Whirlpool', color: '#7ff0e0', desc: 'Pull the fish into your bar for 3.5s', use() {
      reel.pull = PULL_TIME; reel.fishV = 0;
      ability = { kind: 'whirlpool', t: 0, dur: PULL_TIME };
      msg('<b style="color:#7ff0e0">🌀 Whirlpool!</b> The fish is being pulled into your bar!');
    } },
  };

  function usePower() {
    const pw = POWERS[rod().power];
    if (!pw || state !== 'reeling' || !reel || reel.powerUsed) return;
    reel.powerUsed = true; $('powerBtn').disabled = true;
    pw.use();
  }
  $('powerBtn').addEventListener('click', usePower);
  window.addEventListener('keydown', e => { if (e.code === 'KeyF') usePower(); });

  function burst(x, y, n, colors, speed) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = speed * (0.3 + Math.random() * 0.7);
      fxParticles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 500, life: 0.4 + Math.random() * 0.5,
        max: 0.9, size: 1.5 + Math.random() * 2.5, color: colors[i % colors.length], streak: true });
    }
  }

  // jagged lightning path between two points, with small forks
  function makeBolt(x1, y1, x2, y2, rough) {
    const pts = [[x1, y1]], steps = 12;
    for (let i = 1; i < steps; i++) {
      const k = i / steps;
      pts.push([x1 + (x2 - x1) * k + (Math.random() - 0.5) * rough, y1 + (y2 - y1) * k + (Math.random() - 0.5) * rough * 0.3]);
    }
    pts.push([x2, y2]);
    const forks = [];
    for (let f = 0; f < 2; f++) {
      const s = pts[3 + Math.floor(Math.random() * 6)], fp = [s];
      let [x, y] = s;
      for (let i = 0; i < 4; i++) { x += (Math.random() - 0.3) * rough * 0.8; y += rough * 0.4 * Math.random() + 8; fp.push([x, y]); }
      forks.push(fp);
    }
    return { pts, forks };
  }
  function strokeBolt(b, alpha, width) {
    const path = pts => { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke(); };
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.strokeStyle = `rgba(140,210,255,${0.35 * alpha})`; ctx.lineWidth = width * 4; path(b.pts);
    ctx.strokeStyle = `rgba(255,250,200,${0.9 * alpha})`; ctx.lineWidth = width * 1.6; path(b.pts);
    ctx.strokeStyle = `rgba(255,255,255,${alpha})`; ctx.lineWidth = width * 0.6; path(b.pts);
    ctx.strokeStyle = `rgba(200,235,255,${0.7 * alpha})`; ctx.lineWidth = width * 0.6;
    b.forks.forEach(path);
  }

  function updateAbility(dt) {
    for (const p of fxParticles) {
      p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      if (p.orbit) { p.a += p.spin * dt; p.r *= Math.pow(0.5, dt); p.x = p.cx + Math.cos(p.a) * p.r; p.y = p.cy + Math.sin(p.a) * p.r * 0.35; }
    }
    fxParticles = fxParticles.filter(p => p.life > 0);
    if (!ability) return;
    ability.t += dt;
    // whirlpool winds down early if the reel ends
    if (ability.kind === 'whirlpool' && !reel) ability.t = Math.max(ability.t, ability.dur - 0.4);
    if (ability.kind === 'whirlpool' && ability.t < ability.dur - 0.4 && Math.random() < dt * 30) {
      // droplets spiralling into the vortex
      const a = Math.random() * Math.PI * 2;
      fxParticles.push({ orbit: true, cx: bobber.x, cy: bobber.y + 10, a, r: 70 + Math.random() * 40, spin: 5,
        x: 0, y: 0, vx: 0, vy: 0, g: 0, life: 1, max: 1, size: 1.5 + Math.random() * 2, color: 'rgba(210,255,250,' });
    }
    if (ability.t >= ability.dur) ability = null;
  }

  // effects in the water / sky (drawn under the reel UI)
  function drawAbilityWorld() {
    if (!ability) return;
    const A = ability, T = A.t, bx = bobber.x, by = bobber.y + 10;
    if (A.kind === 'lightning') {
      // storm darkening the sky
      const dark = T < 0.1 ? T / 0.1 : Math.max(0, 1 - (T - 0.1) / (A.dur - 0.1));
      ctx.fillStyle = `rgba(20,20,50,${0.5 * dark})`; ctx.fillRect(0, 0, W, waterY());
      ctx.fillStyle = `rgba(40,40,70,${0.85 * dark})`;
      for (let i = 0; i < 5; i++) {
        ctx.beginPath(); ctx.ellipse(bx - 120 + i * 60, 20 + (i % 2) * 14, 70, 30, 0, 0, Math.PI * 2); ctx.fill();
      }
      // flickering main bolt from the clouds to the bobber
      if (T < 0.55) {
        if (!A.bolt || T - A.seed > 0.06) { A.bolt = makeBolt(bx + (Math.random() - 0.5) * 40, 20, bx, by, 60); A.seed = T; }
        const flick = T < 0.2 ? 1 : (Math.random() < 0.6 ? 1 - T / 0.55 : 0.15);
        strokeBolt(A.bolt, flick, 4);
      }
      // electric ring spreading on the water
      if (T < 0.9) {
        const k = T / 0.9;
        ctx.strokeStyle = `rgba(180,230,255,${1 - k})`; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.ellipse(bx, by, 20 + k * 120, (20 + k * 120) * 0.3, 0, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = `rgba(255,245,160,${1 - k})`; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.ellipse(bx, by, 10 + k * 80, (10 + k * 80) * 0.3, 0, 0, Math.PI * 2); ctx.stroke();
      }
    } else if (A.kind === 'whirlpool') {
      const grow = Math.min(1, T / 0.4) * Math.min(1, (A.dur - T) / 0.4), R = 110 * grow;
      ctx.save(); ctx.translate(bx, by); ctx.scale(1, 0.32);
      // dark eye of the vortex
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, R);
      g.addColorStop(0, 'rgba(2,30,45,.95)'); g.addColorStop(0.35, 'rgba(10,80,100,.7)'); g.addColorStop(1, 'rgba(40,160,180,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
      // spinning spiral arms
      for (let arm = 0; arm < 5; arm++) {
        ctx.beginPath();
        for (let r = 4; r <= R; r += 3) {
          const a = arm * Math.PI * 2 / 5 + r * 0.06 - T * 7;
          const x = Math.cos(a) * r, y = Math.sin(a) * r;
          r === 4 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.strokeStyle = arm % 2 ? 'rgba(220,255,250,.75)' : 'rgba(120,230,220,.6)';
        ctx.lineWidth = 4; ctx.stroke();
      }
      // rotating foam rings
      ctx.setLineDash([10, 14]);
      for (let i = 1; i <= 3; i++) {
        ctx.lineDashOffset = T * 60 * (i % 2 ? 1 : -1);
        ctx.strokeStyle = `rgba(255,255,255,${0.5 - i * 0.1})`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, R * (0.35 + i * 0.22), 0, Math.PI * 2); ctx.stroke();
      }
      ctx.setLineDash([]);
      ctx.restore();
    }
  }

  // effects drawn on the reel track
  function drawAbilityReel(g, fy) {
    const r = reel, cx = g.bx + g.bw / 2;
    if (r.stun) {
      // crackling arcs around the stunned fish
      ctx.save(); ctx.beginPath(); ctx.rect(g.bx - 10, g.by, g.bw + 20, g.bh); ctx.clip();
      for (let i = 0; i < 3; i++) {
        const a = Math.random() * Math.PI * 2;
        strokeBolt(makeBolt(cx, fy, cx + Math.cos(a) * 26, fy + Math.sin(a) * 20, 10), r.stun / STUN_TIME, 1.5);
      }
      ctx.restore();
    }
    if (ability && ability.kind === 'lightning' && ability.t < 0.4) {
      // bolt down the track into the fish
      strokeBolt(makeBolt(cx + (Math.random() - 0.5) * 10, g.by, cx, fy, 18), 1 - ability.t / 0.4, 3);
    }
    if (r.pull) {
      const T = t, k = r.pull / PULL_TIME;
      ctx.save(); ctx.beginPath(); ctx.rect(g.bx, g.by, g.bw, g.bh); ctx.clip();
      ctx.fillStyle = 'rgba(60,200,190,.15)'; ctx.fillRect(g.bx, g.by, g.bw, g.bh);
      // current flowing from the fish toward the bar's centre
      const zy = g.by + g.bh - r.zone * g.bh;
      ctx.strokeStyle = 'rgba(160,255,240,.85)'; ctx.lineWidth = 3; ctx.setLineDash([6, 8]);
      ctx.lineDashOffset = (zy > fy ? -1 : 1) * T * 60;
      for (const off of [-10, 10]) { ctx.beginPath(); ctx.moveTo(cx + off, fy); ctx.lineTo(cx + off, zy); ctx.stroke(); }
      ctx.setLineDash([]);
      // mini vortex spinning around the fish
      for (let arm = 0; arm < 3; arm++) {
        ctx.beginPath();
        for (let rr = 3; rr <= 22; rr += 1.5) {
          const a = arm * Math.PI * 2 / 3 + rr * 0.25 - T * 10;
          const x = cx + Math.cos(a) * rr, y = fy + Math.sin(a) * rr;
          rr === 3 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.strokeStyle = 'rgba(200,255,250,.8)'; ctx.lineWidth = 2; ctx.stroke();
      }
      // bubbles rising up the track
      ctx.fillStyle = 'rgba(220,255,252,.7)';
      for (let i = 0; i < 7; i++) {
        const y = g.by + g.bh - ((T * 80 + i * 53) % g.bh), x = g.bx + 6 + (i * 17) % (g.bw - 12);
        ctx.beginPath(); ctx.arc(x + Math.sin(T * 4 + i) * 3, y, 2 + (i % 3), 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
      ctx.fillStyle = '#7ff0e0'; ctx.fillRect(g.bx, g.by - 6, g.bw * k, 3);
    }
  }

  // full-screen overlays, sparks and floating text
  function drawAbilityOverlay() {
    for (const p of fxParticles) {
      const a = Math.max(0, p.life / p.max);
      ctx.globalCompositeOperation = 'lighter';
      if (p.streak) {
        ctx.strokeStyle = p.color + a + ')'; ctx.lineWidth = p.size;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.03, p.y - p.vy * 0.03); ctx.stroke();
      } else {
        ctx.fillStyle = p.color + a + ')';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.globalCompositeOperation = 'source-over';
    if (!ability) return;
    const T = ability.t;
    if (ability.kind === 'lightning') {
      if (T < 0.25) { ctx.fillStyle = `rgba(255,255,240,${0.75 * (1 - T / 0.25)})`; ctx.fillRect(0, 0, W, H); }
      // "+25%" rising next to the progress meter
      const g = reelGeom(), a = Math.max(0, 1 - T / ability.dur);
      ctx.font = '900 22px system-ui, sans-serif'; ctx.textAlign = 'right';
      ctx.lineWidth = 4; ctx.strokeStyle = `rgba(60,40,0,${a})`; ctx.fillStyle = `rgba(255,230,90,${a})`;
      const y = g.by + g.bh * 0.3 - T * 50;
      ctx.strokeText('+25%', g.bx - 14, y); ctx.fillText('+25%', g.bx - 14, y);
    } else if (ability.kind === 'whirlpool' && T < 0.3) {
      ctx.fillStyle = `rgba(120,240,225,${0.35 * (1 - T / 0.3)})`; ctx.fillRect(0, 0, W, H);
    }
  }

  function reelGeom() {
    const bw = 44, bh = Math.min(H * 0.55, 360);
    return { bw, bh, bx: W - bw - 40, by: (H - bh) / 2 };
  }

  function reset(delay) { $('powerBtn').hidden = true; state = 'result'; resultTimer = delay; reel = null; }

  // ---------- Update ----------
  function update(dt) {
    t += dt;
    if (state === 'charging') {
      charge += chargeDir * dt * 1.2;
      if (charge >= 1) { charge = 1; chargeDir = -1; }
      if (charge <= 0) { charge = 0; chargeDir = 1; }
    } else if (state === 'flying') {
      bobber.t = Math.min(1, bobber.t + dt * 1.6);
      const k = bobber.t;
      bobber.x = bobber.sx + (bobber.tx - bobber.sx) * k;
      bobber.y = bobber.sy + (bobber.ty - bobber.sy) * k - Math.sin(k * Math.PI) * 140;
      if (k >= 1) startWait();
    } else if (state === 'waiting') {
      waitTimer -= dt; if (waitTimer <= 0) startBite();
    } else if (state === 'bite') {
      biteTimer -= dt;
      if (biteTimer <= 0) { msg('Too slow! It got away.'); reset(1.5); }
    } else if (state === 'reeling') {
      const r = reel, d = hooked.diff;
      // fish darts around; harder fish move more often and further
      if (r.frozen > 0) r.frozen = Math.max(0, r.frozen - dt);
      if (r.stun > 0) r.stun = Math.max(0, r.stun - dt);
      if (r.pull > 0) r.pull = Math.max(0, r.pull - dt);
      const held = r.frozen || r.stun || r.pull;
      if (!held) r.retarget -= dt;
      if (r.retarget <= 0 && !held) {
        r.retarget = 0.35 + Math.random() * (1.4 - d);
        const jump = (Math.random() - 0.5) * (0.4 + d);
        r.fishTarget = Math.max(0.03, Math.min(0.97, r.fish + jump));
      }
      if (r.pull) {
        // whirlpool drags the fish toward the middle of the player's bar
        r.fish += (r.zone - r.fish) * Math.min(1, 2.5 * dt); r.fishTarget = r.fish;
      } else if (!held) {
        r.fishV += (r.fishTarget - r.fish) * (6 + d * 10) * dt;
        r.fishV *= Math.pow(0.02, dt);
        r.fish = Math.max(0, Math.min(1, r.fish + r.fishV * dt * 4));
      } else r.fishTarget = r.fish;
      // player bar: gravity vs lift
      r.zoneV += (pressing ? 2.6 : -2.2) * dt;
      r.zoneV *= Math.pow(0.3, dt);
      r.zone += r.zoneV * dt;
      const half = r.size / 2;
      if (r.zone < half) { r.zone = half; r.zoneV = Math.max(0, r.zoneV) * -0.3; }
      if (r.zone > 1 - half) { r.zone = 1 - half; r.zoneV = Math.min(0, r.zoneV) * -0.3; }
      const inside = Math.abs(r.fish - r.zone) < half;
      r.inside = inside;
      r.progress += (inside ? 0.28 * rod().speed : -0.2 - d * 0.1) * dt;
      if (r.progress >= 1) finishReel(true);
      else if (r.progress <= 0) finishReel(false);
    } else if (state === 'result') {
      resultTimer -= dt;
      if (resultTimer <= 0) { state = 'idle'; msg('Hold to charge your cast, release to throw.'); }
    }
  }

  // ---------- Draw ----------
  function draw() {
    const wy = waterY();
    // screen shake for the first moments of a legendary catch
    ctx.save();
    if (shake.t > 0) {
      const m = shake.mag * shake.t / shake.dur;
      ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m);
    }
    // sky
    let g = ctx.createLinearGradient(0, 0, 0, wy);
    g.addColorStop(0, '#ffb3c7'); g.addColorStop(1, '#ffe3b0');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, wy);
    // sun
    ctx.fillStyle = 'rgba(255,240,200,.9)';
    ctx.beginPath(); ctx.arc(W * 0.78, wy * 0.45, Math.min(W, H) * 0.08, 0, Math.PI * 2); ctx.fill();
    // floating petals
    for (let i = 0; i < 14; i++) {
      const px = (i * 137 + t * 20 * (1 + i % 3)) % (W + 40) - 20;
      const py = (i * 53 % wy) + Math.sin(t + i) * 10;
      ctx.fillStyle = 'rgba(255,140,180,.7)';
      ctx.beginPath(); ctx.ellipse(px, py, 5, 3, t + i, 0, Math.PI * 2); ctx.fill();
    }
    // water
    g = ctx.createLinearGradient(0, wy, 0, H);
    g.addColorStop(0, '#3aa6c9'); g.addColorStop(1, '#0b3a5c');
    ctx.fillStyle = g; ctx.fillRect(0, wy, W, H - wy);
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 2;
    for (let row = 0; row < 4; row++) {
      ctx.beginPath();
      for (let x = 0; x <= W; x += 12) {
        const y = wy + 8 + row * 26 + Math.sin(x * 0.03 + t * 2 + row) * 3;
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    // dock
    ctx.fillStyle = '#7a4a2b';
    ctx.fillRect(0, wy - 20, W * 0.22, 20);
    for (let i = 0; i < 3; i++) ctx.fillRect(W * 0.04 + i * W * 0.07, wy - 4, 8, 60);
    // fisher
    const fx = W * 0.1, fy = wy - 20;
    ctx.fillStyle = '#2b3550';
    ctx.fillRect(fx - 10, fy - 50, 20, 50);
    ctx.fillStyle = '#ffd9b3';
    ctx.beginPath(); ctx.arc(fx, fy - 62, 12, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff7aa8'; ctx.fillRect(fx - 16, fy - 74, 32, 6); ctx.fillRect(fx - 9, fy - 86, 18, 12);
    // rod
    const tip = rodTip();
    ctx.strokeStyle = '#5a3a20'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(fx + 8, fy - 35); ctx.lineTo(tip.x, tip.y); ctx.stroke();
    // line + bobber
    if (['flying', 'waiting', 'bite', 'reeling'].includes(state)) {
      let bx = bobber.x, by = bobber.y;
      if (state === 'waiting') by += Math.sin(t * 3) * 2;
      if (state === 'bite') by += 6 + Math.sin(t * 30) * 4;
      if (state === 'reeling') { bx += Math.sin(t * 20) * 3; by += 8; }
      ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(tip.x, tip.y);
      ctx.quadraticCurveTo((tip.x + bx) / 2, Math.max(tip.y, by) + 30, bx, by); ctx.stroke();
      ctx.fillStyle = '#ff4d6d'; ctx.beginPath(); ctx.arc(bx, by, 7, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(bx, by, 7, 0, Math.PI); ctx.fill();
      if (state === 'bite') {
        ctx.fillStyle = '#fff'; ctx.font = 'bold 34px system-ui'; ctx.textAlign = 'center';
        ctx.fillText('!', bx, by - 20);
      }
    }
    // charge meter
    if (state === 'charging') {
      const mw = 160, mx = fx - 20, my = fy - 120;
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(mx, my, mw, 14);
      ctx.fillStyle = `hsl(${120 * charge}, 80%, 55%)`; ctx.fillRect(mx, my, mw * charge, 14);
      ctx.strokeStyle = '#fff'; ctx.strokeRect(mx, my, mw, 14);
    }
    drawAbilityWorld();
    if (state === 'reeling') drawReel();
    ctx.restore();
    drawAbilityOverlay();
    if (celebrate) drawCelebration();
  }

  function drawReel() {
    const r = reel;
    const geom = reelGeom(), { bw, bh, bx, by } = geom;
    // track
    ctx.fillStyle = 'rgba(10,20,35,.85)';
    roundRect(bx - 8, by - 8, bw + 16 + 22, bh + 16, 12); ctx.fill();
    ctx.fillStyle = '#1d3554'; ctx.fillRect(bx, by, bw, bh);
    // player zone (0 = bottom, 1 = top)
    const zh = r.size * bh, zy = by + bh - r.zone * bh - zh / 2;
    ctx.fillStyle = r.inside ? 'rgba(107,227,138,.6)' : 'rgba(255,255,255,.35)';
    ctx.fillRect(bx, zy, bw, zh);
    // fish
    const fy = by + bh - r.fish * bh;
    const jx = r.stun ? (Math.random() - 0.5) * 6 : 0; // stunned fish twitches
    ctx.fillStyle = r.frozen ? '#bfefff' : r.stun ? '#fff6a8' : RARITIES[hooked.rarity].color;
    ctx.beginPath(); ctx.ellipse(bx + bw / 2 + jx, fy, 14, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(bx + bw / 2 + 12 + jx, fy); ctx.lineTo(bx + bw / 2 + 20 + jx, fy - 7);
    ctx.lineTo(bx + bw / 2 + 20 + jx, fy + 7); ctx.fill();
    drawAbilityReel(geom, fy);
    if (r.frozen) {
      // ice block around the fish + frost on the track
      ctx.fillStyle = 'rgba(150,225,255,.18)'; ctx.fillRect(bx, by, bw, bh);
      ctx.fillStyle = 'rgba(200,245,255,.45)'; ctx.strokeStyle = '#e8fbff'; ctx.lineWidth = 2;
      roundRect(bx + 2, fy - 13, bw - 4, 26, 5); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(bx + 8, fy - 9); ctx.lineTo(bx + 15, fy - 2); ctx.stroke();
      // snowflakes drifting down the track
      ctx.fillStyle = '#fff';
      for (let i = 0; i < 6; i++) {
        const sy = by + ((t * 60 + i * 61) % bh), sx = bx + 6 + (i * 13) % (bw - 12);
        ctx.beginPath(); ctx.arc(sx, sy, 2, 0, Math.PI * 2); ctx.fill();
      }
      // time left
      ctx.fillStyle = '#9fe6ff'; ctx.fillRect(bx, by - 6, bw * (r.frozen / FREEZE_TIME), 3);
    }
    // progress
    const px = bx + bw + 6;
    ctx.fillStyle = '#0b1a2a'; ctx.fillRect(px, by, 10, bh);
    ctx.fillStyle = r.progress > 0.66 ? '#6be38a' : r.progress > 0.33 ? '#ffcc4d' : '#ff6b6b';
    ctx.fillRect(px, by + bh * (1 - r.progress), 10, bh * r.progress);
  }

  function roundRect(x, y, w, h, rad) {
    ctx.beginPath();
    ctx.moveTo(x + rad, y); ctx.arcTo(x + w, y, x + w, y + h, rad); ctx.arcTo(x + w, y + h, x, y + h, rad);
    ctx.arcTo(x, y + h, x, y, rad); ctx.arcTo(x, y, x + w, y, rad); ctx.closePath();
  }

  // ---------- Panels ----------
  function renderShop() {
    $('shopList').innerHTML = RODS.map((r, i) => {
      const owned = save.owned.includes(i), equipped = save.rod === i;
      const label = equipped ? 'Equipped' : owned ? 'Equip' : `Buy ${r.cost} 🪙`;
      const dis = equipped || (!owned && save.coins < r.cost);
      return `<div class="row"><div><b>${r.name}</b>
        <small>Bar ${Math.round(r.bar * 100)}% · Luck x${r.luck} · Speed x${r.speed}</small>
        ${r.power ? `<small style="color:${POWERS[r.power].color}">${POWERS[r.power].label} power: ${POWERS[r.power].desc} (once per catch)</small>` : ''}</div>
        <button data-rod="${i}" ${dis ? 'disabled' : ''}>${label}</button></div>`;
    }).join('');
  }
  function renderBook() {
    $('bookList').innerHTML = FISH.map(f => {
      const n = save.caught[f.name] || 0, c = RARITIES[f.rarity].color;
      return `<div class="row"><div><b style="color:${n ? c : '#667'}">${n ? f.name : '???'}</b>
        <small>${f.rarity} · ${f.price} 🪙</small></div><div>x${n}</div></div>`;
    }).join('');
  }
  $('shopList').addEventListener('click', e => {
    const b = e.target.closest('button[data-rod]'); if (!b) return;
    const i = +b.dataset.rod;
    if (!save.owned.includes(i)) {
      if (save.coins < RODS[i].cost) return;
      save.coins -= RODS[i].cost; save.owned.push(i);
    }
    save.rod = i; persist(); updateCoins(); renderShop();
  });
  $('shopBtn').onclick = () => { renderShop(); $('shop').classList.add('open'); };
  $('bookBtn').onclick = () => { renderBook(); $('book').classList.add('open'); };
  document.querySelectorAll('[data-close]').forEach(b =>
    b.onclick = () => $(b.dataset.close).classList.remove('open'));

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (shake.t > 0) shake.t = Math.max(0, shake.t - dt);
    update(dt); updateCelebration(dt); updateAbility(dt); draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
